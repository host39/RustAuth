[workspace]
resolver = "3"
members = ["crates/*", "examples/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "MIT"
repository = "https://github.com/host39/lib-rustauth"

[workspace.dependencies]
# Internal crates
rustauth = { path = "crates/rustauth" }
rustauth-axum = { path = "crates/rustauth-axum" }
rustauth-contracts = { path = "crates/rustauth-contracts" }
rustauth-core = { path = "crates/rustauth-core" }
rustauth-crypto = { path = "crates/rustauth-crypto" }
rustauth-postgres = { path = "crates/rustauth-postgres" }

# External crates. Versions match the RustInit template so applications compile one copy of each.
# Lines carry no features (or only the ones every user needs): each crate enables what it uses, so
# applications are not forced into features they do not need.
argon2 = "0.6.0"
async-trait = "0.1.89"
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
getrandom = "0.4.3"
http-body-util = "0.1.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.2"
sqlx = { version = "0.9.1", default-features = false }
thiserror = "2.0.17"
tokio = "1.48.0"
tower = "0.5.2"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
ts-rs = "12.0.1"
utoipa = "6.0.0"
utoipa-axum = "0.3.0"
uuid = "1.29.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "warn"
