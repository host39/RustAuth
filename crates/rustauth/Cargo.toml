[package]
name = "rustauth"
description = "Reusable authentication and authorization for axum + sqlx + Postgres applications."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["axum", "postgres"]
# HTTP routes, guard layer, and extractors for axum.
axum = ["contracts", "dep:rustauth-axum", "dep:utoipa-axum"]
# The request and response DTOs (`rustauth::contracts`), with utoipa schemas.
contracts = ["dep:rustauth-contracts"]
# The Argon2id hasher and random session tokens (`rustauth::ports`), to combine with custom
# storage.
crypto = ["dep:rustauth-crypto"]
# The embedded `auth` schema migrations and `schema_status` only, for a crate that runs the
# migrate step: Postgres and sqlx, without HTTP, OpenAPI, or hashing crates.
migrate = ["dep:rustauth-postgres", "dep:sqlx"]
# Postgres storage for `RustAuth::builder().pool(...)`, with the startup schema check.
postgres = ["crypto", "migrate"]
# In-memory fakes of every port (`rustauth::testing`), for application tests without Postgres.
testing = ["rustauth-core/testing"]
# `ts_rs::TS` derives on the contracts, for applications that export TypeScript bindings.
ts = ["contracts", "rustauth-contracts/ts"]

[dependencies]
rustauth-axum = { workspace = true, optional = true }
rustauth-contracts = { workspace = true, optional = true }
rustauth-core = { workspace = true }
rustauth-crypto = { workspace = true, optional = true }
rustauth-postgres = { workspace = true, optional = true }
# Names `PgPool` in the builder; the application picks the TLS backend.
sqlx = { workspace = true, optional = true, features = ["postgres"] }
thiserror = { workspace = true }
tracing = { workspace = true }
utoipa-axum = { workspace = true, optional = true }

[dev-dependencies]
axum = { workspace = true }
http-body-util = { workspace = true }
rustauth-core = { workspace = true, features = ["testing"] }
serde_json = { workspace = true }
# `#[sqlx::test]` databases for the end-to-end test (`make test-db`).
sqlx = { workspace = true, features = ["macros", "migrate", "postgres", "runtime-tokio"] }
tokio = { workspace = true, features = ["macros", "rt"] }
tower = { workspace = true, features = ["util"] }
tracing-subscriber = { workspace = true, features = ["fmt"] }
# `#[derive(OpenApi)]` in the README example, which runs as a doctest.
utoipa = { workspace = true }

[lints]
workspace = true
