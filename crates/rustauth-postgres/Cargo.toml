[package]
name = "rustauth-postgres"
description = "RustAuth Postgres adapters: sqlx repositories and embedded migrations in schema auth."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
rustauth-core = { workspace = true }
# No TLS feature here: the application builds the `PgPool` and picks its TLS backend.
sqlx = { workspace = true, features = [
  "chrono",
  "macros",
  "migrate",
  "postgres",
  "runtime-tokio",
  "uuid",
] }
# `try_join!` for independent reads on the pool (see the `parallel-db-reads` rule).
tokio = { workspace = true, features = ["macros"] }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# The services and in-memory fakes, to run core's rules against these repositories.
rustauth-core = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true
