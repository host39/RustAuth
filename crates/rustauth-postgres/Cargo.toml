[package]
name = "rustauth-postgres"
description = "RustAuth Postgres adapters: sqlx repositories and embedded migrations in schema auth."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
rustauth-core = { workspace = true }
# No TLS feature here: the application builds the `PgPool` and picks its TLS backend.
sqlx = { workspace = true, features = [
  "chrono",
  "macros",
  "migrate",
  "postgres",
  "runtime-tokio",
  "uuid",
] }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
